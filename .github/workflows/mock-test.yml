name: ArkTS mock test

on:
  push:
    branches: ["main", "dev-*"]
  pull_request:
    branches: ["main", "dev-*"]
  workflow_dispatch:

concurrency:
  group: mock-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock-test:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install HarmonyOS command line tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Point hvigor at the command line tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = $env:HOS_SDK_HOME
          if (-not $sdk) { throw 'HOS_SDK_HOME was not set by setup-ohos' }
          $node = Join-Path (Split-Path $sdk) 'tool\node'
          $previewer = Join-Path $sdk 'default\openharmony\previewer\common\bin\Previewer.exe'
          if (-not (Test-Path -LiteralPath (Join-Path $node 'node.exe'))) { throw "HarmonyOS node missing: $node" }
          if (-not (Test-Path -LiteralPath $previewer)) { throw "Previewer missing: $previewer" }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "DEVECO_SDK_HOME=$sdk$([Environment]::NewLine)")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "NODE_HOME=$node$([Environment]::NewLine)")
      - name: Check DevEco tools
        run: |
          where node
          where java
          where hvigorw
          where ohpm
          node -v
          java -version
          hvigorw -v
      - run: npm install --no-package-lock
      - name: Run netstack mock tests
        run: npm run test:mock
      - run: npm run stage:har
      - name: Install ohpm dependencies
        working-directory: ohos-har
        run: |
          call ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          call ohpm config set strict_ssl false
          call ohpm install --all
          if not exist oh_modules\@ohos\hypium (
            echo ::error::@ohos/hypium was not installed
            exit /b 1
          )
      - name: Run ArkTS mock tests
        run: npm run test:ohpm-mock
      - name: Publish test log
        if: always()
        run: |
          if exist ohos-har\oss-v2\.test\default\intermediates\test\coverage_data\test_result.txt (
            echo ## ArkTS mock tests>>"%GITHUB_STEP_SUMMARY%"
            echo ```>>"%GITHUB_STEP_SUMMARY%"
            type ohos-har\oss-v2\.test\default\intermediates\test\coverage_data\test_result.txt>>"%GITHUB_STEP_SUMMARY%"
            echo ```>>"%GITHUB_STEP_SUMMARY%"
          )
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arkts-mock-test
          path: ohos-har/oss-v2/.test/default/intermediates/test/coverage_data/test_result.txt
          if-no-files-found: warn
